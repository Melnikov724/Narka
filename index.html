<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151C">
<title>Narka Book Reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312151C'/%3E%3Cpath d='M9 5h14v22l-7-5.5L9 27z' fill='%23D0342C'/%3E%3C/svg%3E">
<style>
  :root {
    --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --fs: 21px;
    --red: #D0342C;
  }
  html[data-theme="dark"] {
    --bg:#12151C; --surface:#1B1F29; --raised:#242936; --text:#E9E6DF; --muted:#8E93A1;
    --line:#2C3242; --voice:#7FB8C9; --voice-soft:rgba(127,184,201,.09); --read:#4A5266;
    --spine-text:#F3EFE6; color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg:#EFF1F3; --surface:#FFFFFF; --raised:#E4E8EC; --text:#1D2230; --muted:#667085;
    --line:#D5DAE1; --voice:#17667E; --voice-soft:rgba(23,102,126,.08); --read:#A9B2C0;
    --spine-text:#F6F3EC; color-scheme: light;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }
  button, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--voice); outline-offset:2px; border-radius:6px; }
  svg { display:block; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .ico { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .ico.fill { fill:currentColor; stroke:none; }

  /* Üst çubuk */
  header.top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:10px 18px;
    background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; background:none; border:0; padding:4px; }
  .brand svg { width:26px; height:26px; }
  .wordmark { font-family:var(--serif); font-size:1.5rem; letter-spacing:.01em; line-height:1; }
  .sub { font-size:.78rem; color:var(--muted); margin-left:2px; }
  #title { flex:1; min-width:0; text-align:center; color:var(--muted); font-family:var(--serif); font-style:italic; font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tools { display:flex; gap:4px; align-items:center; }
  .tbtn { background:none; border:1px solid transparent; border-radius:8px; min-width:40px; height:40px; padding:0 8px; display:grid; place-items:center; color:var(--muted); }
  .tbtn:hover { color:var(--text); background:var(--raised); }
  .tbtn.a-s { font-family:var(--serif); font-size:.95rem; }
  .tbtn.a-l { font-family:var(--serif); font-size:1.25rem; }

  #warn { display:none; background:#3A2326; color:#F3C9C5; padding:9px 18px; font-size:.9rem; border-bottom:1px solid #5A3338; }
  html[data-theme="light"] #warn { background:#FBE9E7; color:#8A2A22; border-color:#F1C5C0; }

  /* Ana sayfa */
  #home { max-width:920px; margin:0 auto; padding:9vh 22px 60px; }
  #home h1 { font-family:var(--serif); font-weight:400; font-size:clamp(2rem, 5.2vw, 3.4rem); line-height:1.12; margin:0 0 .5em; max-width:15em; letter-spacing:-.01em; }
  #home p.lead { color:var(--muted); font-size:1.08rem; line-height:1.6; max-width:34em; margin:0 0 1.8em; }
  .pick { display:inline-flex; align-items:center; gap:10px; background:var(--text); color:var(--bg); border:0; border-radius:10px; padding:14px 22px; font-size:1.02rem; font-weight:600; }
  .pick:hover { filter:brightness(1.08); }
  .drop-hint { margin-left:14px; color:var(--muted); font-size:.92rem; }
  body.dragging #home { outline:2px dashed var(--voice); outline-offset:-10px; border-radius:16px; }
  #shelfwrap { margin-top:64px; }
  #shelfwrap h2 { font-family:var(--serif); font-weight:400; font-size:1.3rem; margin:0 0 18px; }
  #shelf { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; padding-bottom:12px; border-bottom:6px solid var(--raised); }
  .spine { position:relative; width:58px; height:210px; border:0; border-radius:4px 4px 2px 2px; padding:14px 0 18px; color:var(--spine-text);
    display:flex; justify-content:center; text-align:left; overflow:hidden; box-shadow:inset -6px 0 10px rgba(0,0,0,.18), inset 2px 0 0 rgba(255,255,255,.08); transition:transform .15s; }
  .spine:hover, .spine:focus-visible { transform:translateY(-8px); }
  .spine span.t { writing-mode:vertical-rl; font-family:var(--serif); font-size:1rem; line-height:1.15; max-height:100%; overflow:hidden; text-overflow:ellipsis; letter-spacing:.02em; }
  .spine .prog { position:absolute; left:0; bottom:0; height:5px; background:rgba(255,255,255,.85); }
  .spine .tab { position:absolute; top:0; right:8px; width:12px; height:30px; background:var(--red); clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%); }
  .spine-wrap { position:relative; }
  .spine-wrap .del { position:absolute; top:-8px; left:-8px; width:24px; height:24px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:15px; line-height:1; display:none; z-index:2; padding:0; }
  .spine-wrap:hover .del, .spine-wrap:focus-within .del { display:block; }
  .spine-note { color:var(--muted); font-size:.85rem; margin:12px 0 0; }

  /* Okuma alanı */
  #reader { display:none; max-width:760px; margin:0 auto; padding:34px 22px 220px 56px; }
  #text .para { position:relative; margin:0 0 1.05em; padding:.15em .6em .15em 1.1em; border-left:2px solid var(--line);
    font-family:var(--serif); font-size:var(--fs); line-height:1.72; max-width:66ch; cursor:pointer; transition:border-color .25s, background .25s, color .25s; text-wrap:pretty; }
  #text .para.read { border-left-color:var(--read); color:color-mix(in srgb, var(--text) 62%, var(--bg)); }
  #text .para.now { border-left:4px solid var(--voice); padding-left:calc(1.1em - 2px); background:var(--voice-soft); color:var(--text); border-radius:0 8px 8px 0; }
  body.speaking #text .para.now { animation:thread 1.8s ease-in-out infinite; }
  @keyframes thread { 0%,100% { border-left-color:var(--voice); } 50% { border-left-color:color-mix(in srgb, var(--voice) 35%, transparent); } }
  #text .para.head { font-size:calc(var(--fs) * 1.3); font-weight:700; line-height:1.3; margin-top:1.8em; }
  #text .para.rb::after { content:""; position:absolute; left:-36px; top:-.15em; width:16px; height:44px; background:var(--red);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%); filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)); }

  /* Kontrol hapı */
  #dock { position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(880px, calc(100% - 20px)); z-index:30; display:none;
    background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:0 14px 44px rgba(0,0,0,.38); overflow:hidden; }
  #dock .progress { height:4px; background:var(--raised); }
  #dock .progress i { display:block; height:100%; width:0; background:var(--voice); transition:width .3s; }
  .dockrow { display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; justify-content:space-between; padding:12px 18px 8px; }
  .transport { display:flex; align-items:center; gap:8px; }
  .round { width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--raised); display:grid; place-items:center; }
  .round:hover { border-color:var(--voice); }
  .round:disabled { opacity:.4; cursor:default; }
  .round.big { width:62px; height:62px; background:var(--text); color:var(--bg); border-color:var(--text); }
  .round.big .ico { width:26px; height:26px; }
  .ribs { display:flex; gap:8px; }
  .pill { display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:none; font-size:.9rem; }
  .pill:hover { border-color:var(--voice); }
  .pill:disabled { opacity:.4; cursor:default; }
  .pill[aria-pressed="true"] { border-color:var(--red); }
  .pill .rbn { width:11px; height:17px; background:var(--red); clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%); flex:none; }
  .tune { display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:.88rem; color:var(--muted); }
  .tune label { display:flex; align-items:center; gap:8px; }
  .tune select { min-width:150px; max-width:230px; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--text); }
  input[type=range] { accent-color:var(--voice); width:110px; }
  #status { padding:0 18px 10px; font-size:.82rem; color:var(--muted); }

  @media (max-width:700px) {
    header.top { padding:8px 10px; gap:6px; }
    .sub, #title { display:none; }
    .tools { margin-left:auto; }
    #reader { padding:22px 14px 280px 38px; }
    #text .para.rb::after { left:-27px; width:13px; height:38px; }
    .dockrow { padding:10px 12px 6px; justify-content:center; }
    .ribs { flex-wrap:wrap; justify-content:center; }
    .pill { padding:0 12px; }
    #reader { padding-bottom:330px; }
    .tune { justify-content:center; }
    input[type=range] { width:90px; }
    #home { padding-top:6vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    body.speaking #text .para.now { animation:none; }
    .spine, #text .para, #dock .progress i { transition:none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M18 5.5v13L9 12z" /></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M6 5.5v13L15 12z" /></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></symbol>
  <symbol id="i-shelf" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 6l4 14"/></symbol>
</svg>

<header class="top">
  <button class="brand" id="brand" aria-label="Narka Book Reader, kitaplığa dön">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1B1F29" stroke="#2C3242"/><path d="M9 5h14v22l-7-5.5L9 27z" fill="#D0342C"/><path d="M13 12.5c1.3-1.3 2.3-1.3 3 0s1.7 1.3 3 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span class="wordmark">Narka</span><span class="sub">Book Reader</span>
  </button>
  <div id="title"></div>
  <div class="tools">
    <button class="tbtn a-s" id="fsDown" aria-label="Yazıyı küçült">A</button>
    <button class="tbtn a-l" id="fsUp" aria-label="Yazıyı büyüt">A</button>
    <button class="tbtn" id="theme" aria-label="Temayı değiştir"><svg class="ico"><use href="#i-sun"/></svg></button>
    <button class="tbtn" id="lib" aria-label="Kitaplık"><svg class="ico"><use href="#i-shelf"/></svg></button>
  </div>
</header>
<div id="warn" role="status"></div>

<main>
  <section id="home">
    <h1>Word dosyanı seç, Narka baştan sona okusun.</h1>
    <p class="lead">Metin olduğu gibi okunur, araya hiçbir şey eklenmez. Kapattığında kaldığın yer ve kırmızı kurdelen saklanır.</p>
    <div>
      <button class="pick" id="pick">Word dosyası seç</button><span class="drop-hint">ya da dosyayı bu sayfaya bırak</span>
      <input id="file" type="file" accept=".docx" hidden>
    </div>
    <div id="shelfwrap" hidden>
      <h2>Kitaplığın</h2>
      <div id="shelf"></div>
      <p class="spine-note">Bir kitaba dokun, kaldığın yerden devam etsin.</p>
    </div>
  </section>

  <article id="reader"><div id="text"></div></article>
</main>

<div id="dock" role="region" aria-label="Okuma kontrolleri">
  <div class="progress"><i></i></div>
  <div class="dockrow">
    <div class="transport">
      <button class="round" id="prev" aria-label="Önceki paragraf"><svg class="ico"><use href="#i-prev"/></svg></button>
      <button class="round big" id="play" aria-label="Oku"><svg class="ico fill"><use href="#i-play"/></svg></button>
      <button class="round" id="next" aria-label="Sonraki paragraf"><svg class="ico"><use href="#i-next"/></svg></button>
    </div>
    <div class="ribs">
      <button class="pill" id="rib" aria-pressed="false"><span class="rbn"></span><span class="lbl" id="ribLbl">Kurdele koy</span></button>
      <button class="pill" id="gorib" disabled><span class="lbl">Kurdeleye git</span><svg class="ico" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="tune">
      <label>Hız <input id="rate" type="range" min="0.6" max="1.8" step="0.05" value="1"><span id="rateV">1.0×</span></label>
      <label class="vl"><span class="sr">Ses</span><select id="voice" aria-label="Ses"></select></label>
    </div>
  </div>
  <div id="status" aria-live="polite"></div>
</div>

<script>
"use strict";
/* ---------- DOCX okuma (kütüphanesiz) ---------- */
async function inflateRaw(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readZipEntry(buf, wanted) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Bu dosya geçerli bir .docx değil.");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    if (name === wanted) {
      const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lelen;
      const data = u8.subarray(start, start + csize);
      return method === 0 ? data : await inflateRaw(data);
    }
    p += 46 + nlen + elen + clen;
  }
  throw new Error("Dosyanın içinde " + wanted + " bulunamadı.");
}
const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
function paraText(pEl) {
  let out = "";
  (function walk(node) {
    for (const c of node.childNodes) {
      if (c.nodeType !== 1) continue;
      if (c.namespaceURI !== W) { walk(c); continue; }
      const t = c.localName;
      if (t === "t") out += c.textContent;
      else if (t === "tab" || t === "br" || t === "cr") out += " ";
      else if (t === "delText" || t === "instrText" || t === "pPr" || t === "rPr") { /* atla */ }
      else walk(c);
    }
  })(pEl);
  return out.replace(/\s+/g, " ").trim();
}
async function parseDocx(buf) {
  const xml = new TextDecoder().decode(await readZipEntry(buf, "word/document.xml"));
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("Word içeriği okunamadı.");
  const paras = [];
  for (const p of doc.getElementsByTagNameNS(W, "p")) {
    const text = paraText(p);
    if (!text) continue;
    const ps = p.getElementsByTagNameNS(W, "pStyle")[0];
    const style = ps ? (ps.getAttributeNS(W, "val") || "") : "";
    paras.push({ text, head: /^(Heading|Balk|Title|Ba)/i.test(style) });
  }
  return paras;
}

/* ---------- Durum / kayıt ---------- */
const $ = id => document.getElementById(id);
const KEY = "narkaBookReader.v1", OLD_KEY = "sesliOkuyucu.v1";
let book = null, idx = 0, playing = false, token = 0, voices = [];
const synth = window.speechSynthesis;

function loadStore() {
  try {
    let s = JSON.parse(localStorage.getItem(KEY));
    if (!s) { s = JSON.parse(localStorage.getItem(OLD_KEY)); }
    return s || {};
  } catch { return {}; }
}
function saveStore(s) {
  try { localStorage.setItem(KEY, JSON.stringify(s)); hideWarn(); }
  catch { showWarn("Tarayıcı depolaması dolu: kaldığın yer ve kurdele kaydedilemeyebilir. Kitaplıktan eski kitapları silebilirsin."); }
}
function showWarn(m) { const w = $("warn"); w.textContent = m; w.style.display = "block"; }
function hideWarn() { $("warn").style.display = "none"; }
function saveProgress() {
  if (!book) return;
  const s = loadStore(); s.books = s.books || {};
  s.books[book.id] = { name: book.name, paras: book.paras, pos: idx, rib: book.rib, at: Date.now() };
  s.last = book.id; s.rate = $("rate").value; s.voice = $("voice").value;
  saveStore(s);
}
function savePref(k, v) { const s = loadStore(); s[k] = v; saveStore(s); }
function hashId(name, paras) {
  let h = 5381; const sample = paras.slice(0, 20).map(p => p.text).join("|") + paras.length;
  for (let i = 0; i < sample.length; i++) h = ((h << 5) + h + sample.charCodeAt(i)) | 0;
  return name + ":" + (h >>> 0).toString(36);
}

/* ---------- Tema ve yazı boyutu ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("theme").innerHTML = '<svg class="ico"><use href="#i-' + (t === "dark" ? "sun" : "moon") + '"/></svg>';
  $("theme").setAttribute("aria-label", t === "dark" ? "Açık temaya geç" : "Koyu temaya geç");
  document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#12151C" : "#EFF1F3";
}
function applyFs(px) { document.documentElement.style.setProperty("--fs", px + "px"); }
let fs = 21;
(function initPrefs() {
  const s = loadStore();
  applyTheme(s.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  fs = s.fs || 21; applyFs(fs);
})();
$("theme").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; applyTheme(t); savePref("theme", t); };
$("fsUp").onclick = () => { fs = Math.min(34, fs + 2); applyFs(fs); savePref("fs", fs); };
$("fsDown").onclick = () => { fs = Math.max(15, fs - 2); applyFs(fs); savePref("fs", fs); };

/* ---------- Ekran ---------- */
function setPlayIcon() {
  $("play").innerHTML = '<svg class="ico fill"><use href="#i-' + (playing ? "pause" : "play") + '"/></svg>';
  $("play").setAttribute("aria-label", playing ? "Duraklat" : (idx > 0 ? "Devam et" : "Oku"));
  document.body.classList.toggle("speaking", playing);
}
function render() {
  const box = $("text"); box.textContent = "";
  const frag = document.createDocumentFragment();
  book.paras.forEach((p, i) => {
    const el = document.createElement("p");
    el.className = "para" + (p.head ? " head" : "");
    el.id = "p" + i; el.textContent = p.text;
    el.onclick = () => jump(i);
    frag.appendChild(el);
  });
  box.appendChild(frag);
  $("home").style.display = "none";
  $("reader").style.display = "block"; $("dock").style.display = "block";
  $("title").textContent = book.name;
  document.title = book.name + " — Narka Book Reader";
  mark(true);
}
function mark(instant) {
  if (!book) return;
  book.paras.forEach((_, i) => {
    const e = $("p" + i); if (!e) return;
    e.classList.toggle("read", i < idx);
    e.classList.toggle("now", i === idx);
    e.classList.toggle("rb", i === book.rib);
  });
  const el = $("p" + idx);
  if (el) el.scrollIntoView({ block: "center", behavior: instant || matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  $("gorib").disabled = !(book.rib >= 0);
  const on = book.rib === idx;
  $("rib").setAttribute("aria-pressed", on ? "true" : "false");
  $("ribLbl").textContent = on ? "Kurdeleyi kaldır" : "Kurdele koy";
  const n = book.paras.length, pct = n ? Math.round(idx / n * 100) : 0;
  document.querySelector("#dock .progress i").style.width = pct + "%";
  $("status").textContent = (playing ? "Okuyor. " : "Duraklatıldı. ") + "Paragraf " + (idx + 1) + " / " + n + ", %" + pct;
  setPlayIcon();
}

/* ---------- Seslendirme ---------- */
function loadVoices() {
  voices = synth.getVoices();
  const sel = $("voice"), keep = sel.value || loadStore().voice;
  const tr = voices.filter(v => /^tr/i.test(v.lang));
  const list = tr.length ? tr : voices;
  const FEMALE = /emel|yelda|filiz|seda|female|kad[ıi]n/i, MALE = /ahmet|cem|tolga|male|erkek/i;
  sel.textContent = "";
  list.forEach(v => {
    const o = document.createElement("option"); o.value = v.name;
    const g = FEMALE.test(v.name) ? "Kadın: " : (MALE.test(v.name) ? "Erkek: " : "");
    o.textContent = g + v.name.replace(/^Microsoft\s+/i, "") + " (" + v.lang + ")"; sel.appendChild(o);
  });
  if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
  else { const nat = [...sel.options].find(o => /natural|online|neural/i.test(o.value)); if (nat) sel.value = nat.value; }
  if (voices.length && !tr.length) showWarn("Bu cihazda Türkçe ses bulunamadı. Edge veya Chrome ile açmayı dene ya da cihazına Türkçe ses ekle.");
}
if ("speechSynthesis" in window) { loadVoices(); synth.onvoiceschanged = loadVoices; }
else showWarn("Bu tarayıcı sesli okumayı desteklemiyor. Edge veya Chrome kullan.");

function pieces(text) {
  const out = []; let cur = "";
  for (const s of text.match(/[^.!?…]+[.!?…]+["”')\]]*\s*|[^.!?…]+$/g) || [text]) {
    if ((cur + s).length > 220 && cur) { out.push(cur); cur = s; } else cur += s;
  }
  if (cur) out.push(cur);
  return out;
}
function speakPara(i, myToken) {
  const parts = pieces(book.paras[i].text);
  const voice = voices.find(v => v.name === $("voice").value);
  let k = 0;
  const next = () => {
    if (myToken !== token) return;
    if (k >= parts.length) {
      idx = i + 1;
      if (idx >= book.paras.length) { playing = false; idx = 0; saveProgress(); mark(true); return; }
      saveProgress(); mark(); speakPara(idx, myToken); return;
    }
    const u = new SpeechSynthesisUtterance(parts[k++]);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "tr-TR";
    u.rate = parseFloat($("rate").value);
    u.onend = next;
    u.onerror = e => { if (e.error === "interrupted" || e.error === "canceled") return; next(); };
    synth.speak(u);
  };
  next();
}
function start() { synth.cancel(); token++; playing = true; mark(); speakPara(idx, token); }
function stopSpeech() { token++; synth.cancel(); playing = false; saveProgress(); mark(); }
function jump(i) {
  idx = Math.max(0, Math.min(book.paras.length - 1, i));
  if (playing) start(); else { saveProgress(); mark(); }
}
function togglePlay() { if (!book) return; playing ? stopSpeech() : start(); }

$("play").onclick = togglePlay;
$("rib").onclick = () => { if (!book) return; book.rib = (book.rib === idx) ? -1 : idx; saveProgress(); mark(); };
$("gorib").onclick = () => { if (book && book.rib >= 0) jump(book.rib); };
$("prev").onclick = () => book && jump(idx - 1);
$("next").onclick = () => book && jump(idx + 1);
$("rate").oninput = () => { $("rateV").textContent = parseFloat($("rate").value).toFixed(1) + "×"; if (playing) start(); if (book) saveProgress(); else savePref("rate", $("rate").value); };
$("voice").onchange = () => { if (playing) start(); if (book) saveProgress(); else savePref("voice", $("voice").value); };
document.addEventListener("keydown", e => {
  if (!book || /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowRight") jump(idx + 1);
  else if (e.code === "ArrowLeft") jump(idx - 1);
});
document.addEventListener("visibilitychange", () => { if (document.hidden) saveProgress(); });
window.addEventListener("pagehide", saveProgress);

/* ---------- Dosya ve kitaplık ---------- */
function openBook(b) {
  if (playing) stopSpeech();
  book = b; if (typeof book.rib !== "number") book.rib = -1;
  idx = Math.min(b.pos || 0, b.paras.length - 1);
  render(); saveProgress();
}
async function handleFile(f) {
  if (!f) return;
  if (!/\.docx$/i.test(f.name)) { showWarn("Yalnızca .docx dosyaları açılır. Dosyayı Word'de \"Farklı kaydet\" ile .docx olarak kaydet."); return; }
  hideWarn();
  try {
    const paras = await parseDocx(await f.arrayBuffer());
    if (!paras.length) throw new Error("Dosyada okunacak metin bulunamadı.");
    const id = hashId(f.name, paras);
    const saved = (loadStore().books || {})[id];
    openBook({ id, name: f.name.replace(/\.docx$/i, ""), paras, pos: saved ? saved.pos : 0, rib: saved ? saved.rib : -1 });
  } catch (err) { showWarn(err.message); }
}
$("pick").onclick = () => $("file").click();
$("file").onchange = e => { handleFile(e.target.files[0]); e.target.value = ""; };
["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add("dragging"); }));
["dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.remove("dragging"); }));
document.addEventListener("drop", e => handleFile(e.dataTransfer.files[0]));

const SPINES = ["#3E5C76", "#7A3B3B", "#4F6D5B", "#6B5B7B", "#8A6F3E", "#2F4858", "#5B4B3A", "#44546A"];
function showLibrary() {
  if (playing) stopSpeech();
  book = null; document.title = "Narka Book Reader"; $("title").textContent = "";
  document.body.classList.remove("speaking");
  $("reader").style.display = "none"; $("dock").style.display = "none"; $("home").style.display = "block";
  const s = loadStore();
  if (s.rate) { $("rate").value = s.rate; $("rateV").textContent = parseFloat(s.rate).toFixed(1) + "×"; }
  const shelf = $("shelf"); shelf.textContent = "";
  const items = Object.entries(s.books || {}).sort((a, b) => b[1].at - a[1].at);
  $("shelfwrap").hidden = !items.length;
  for (const [id, b] of items) {
    const wrap = document.createElement("div"); wrap.className = "spine-wrap";
    const sp = document.createElement("button"); sp.className = "spine";
    let h = 0; for (const ch of b.name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    sp.style.background = SPINES[h % SPINES.length];
    const pct = Math.round((b.pos || 0) / b.paras.length * 100);
    sp.setAttribute("aria-label", b.name + ", %" + pct + " okundu");
    const t = document.createElement("span"); t.className = "t"; t.textContent = b.name;
    const pr = document.createElement("i"); pr.className = "prog"; pr.style.width = pct + "%";
    sp.append(t, pr);
    if (b.rib >= 0) { const tab = document.createElement("i"); tab.className = "tab"; sp.appendChild(tab); }
    sp.onclick = () => openBook({ id, name: b.name, paras: b.paras, pos: b.pos, rib: b.rib });
    const del = document.createElement("button"); del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", b.name + " kitabını kitaplıktan sil");
    del.onclick = ev => { ev.stopPropagation(); if (confirm("\"" + b.name + "\" kitaplıktan silinsin mi? Kaldığın yer ve kurdele de silinir.")) { const st = loadStore(); delete st.books[id]; saveStore(st); showLibrary(); } };
    wrap.append(sp, del); shelf.appendChild(wrap);
  }
}
$("brand").onclick = showLibrary; $("lib").onclick = showLibrary;
showLibrary();
</script>
</body>
</html>
